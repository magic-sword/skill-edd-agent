[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edd-agent-tools"
version = "0.2.0"
description = "Evaluation-Driven Development (EDD) tools and helper libraries for AI Agent development"
readme = "README.md"
authors = [
    { name = "EDD Agent Team", email = "edd-agent-dev@example.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "google-genai>=0.1.0",
    "google-adk>=0.1.0",
    "gymnasium>=0.29.0",
    "mcp>=0.1.0",
    "pytest>=8.0.0",
]

[project.scripts]
edd-skills = "edd_agent_tools.skills.cli:main"
edd-eval = "edd_agent_tools.evaluation.cli:main"
edd-agent-mcp = "edd_agent_tools.mcp.server:main"

[project.urls]
"Homepage" = "https://github.com/magic-sword/edd-agent-tools"

[tool.setuptools.package-data]
"edd_agent_tools" = ["AGENTS.md"]
"edd_agent_tools.docs" = ["*.md", "prompts/*"]

[tool.setuptools.packages.find]
where = ["src"]


