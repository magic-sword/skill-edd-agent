[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edd-agent-tools"
version = "0.1.0"
description = "Evaluation-Driven Development (EDD) tools and helper libraries for AI Agent development"
readme = "README.md"
authors = [
    { name = "EDD Agent Team", email = "edd-agent-dev@example.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    # 将来的に必要な依存パッケージがあればここに追記します
]

[project.urls]
"Homepage" = "https://github.com/magic-sword/edd-agent-tools"

[tool.setuptools.packages.find]
where = ["src"]
